<!DOCTYPE html>
<html>

<head>

<title>HomeFinder</title>

<link rel="stylesheet" href="css/style.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

</head>

<body>


<!-- NAVBAR -->

<nav>

<h2>HomeFinder</h2>

<a href="index.html">Home</a>
<a href="properties.html">Properties</a>
<a href="about.html">About</a>
<a href="bookings.html">Bookings</a>

<div id="authArea">

<a href="login.html" id="loginBtn">Login</a>
<a href="signup.html" id="signupBtn">Signup</a>

<button onclick="logout()" id="logoutBtn">
Logout
</button>

</div>

</nav>



<!-- HERO -->

<section class="hero">

<div class="overlay">

<h1>Find Your Dream Home</h1>

<div class="searchBox">

<input id="city" placeholder="City">

<input id="type" placeholder="Type">

<input id="price" placeholder="Max Price">

<button onclick="search()">Search</button>

</div>

</div>

</section>



<!-- PROPERTY TYPES -->

<section class="typesSection">

<h2 class="sectionTitle">

Property <span>Types</span>

</h2>


<div class="typesGrid">

<div class="typeCard" onclick="filterType('Flat')">
Flat
</div>

<div class="typeCard" onclick="filterType('House')">
House
</div>

<div class="typeCard" onclick="filterType('Villa')">
Villa
</div>

</div>

</section>



<!-- LATEST -->

<h2 class="sectionTitle">

Latest <span>Properties</span>

</h2>


<div id="list"></div>



<script type="module" src="js/auth.js"></script>

<script type="module" src="js/main.js"></script>


<script>

let role = localStorage.getItem("role");

let add = document.getElementById("addLink");
let admin = document.getElementById("adminLink");

if (role === "admin") {

if (add) add.style.display = "inline";
if (admin) admin.style.display = "inline";

} else {

if (add) add.style.display = "none";
if (admin) admin.style.display = "none";

}

</script>


</body>
</html>
