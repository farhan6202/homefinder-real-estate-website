<!DOCTYPE html>
<html>

<head>

<title>Signup - HomeFinder</title>

<link rel="stylesheet" href="css/style.css">

<style>

.centerBox{

height:100vh;

display:flex;
justify-content:center;
align-items:center;

}

.formBox{

width:350px;

background:rgba(255,255,255,0.08);

backdrop-filter:blur(10px);

padding:30px;

border-radius:15px;

box-shadow:0 10px 30px rgba(0,0,0,0.6);

text-align:center;

}

.formBox input{

width:100%;
padding:10px;
margin:10px 0;

border:none;
border-radius:8px;

background:rgba(255,255,255,0.2);
color:white;

}

.formBox button{

width:100%;
padding:10px;

background:#f59d56;

border:none;
border-radius:8px;

}

</style>

</head>

<body>


<div class="centerBox">


<div class="formBox">

<h1>Signup</h1>

<input id="email" placeholder="Email">

<input id="pass" placeholder="Password">

<button onclick="signup()">

Signup

</button>

<br><br>

<a href="login.html">

Login

</a>

</div>


</div>


<script type="module" src="js/auth.js"></script>

</body>
</html>
